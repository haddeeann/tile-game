<html>
    <head>
        <title>Tile Game</title>
        <script type="module" src="logic.js"></script>
        <link rel="stylesheet" href="reset.css">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header>
            <h1>Tile Game</h1>
            <div>Strategic tile placement game for two players</div>
        </header>
        <div id="gameScore">
            <div class="statSection">
                <div>Round</div>
                <div id="round" class="round roundLight"></div>
            </div>
            <div class="statSection">
                <div>Player One</div>
                <div id="playerOneScore" class="round roundLight"></div>
            </div>
            <div class="statSection">
                <div>Player Two</div>
                <div id="playerTwoScore" class="round roundLight"></div>
            </div>
            <div class="statSection">
                <div>Status</div>
                <div id="gameOver" class="round roundLight"></div>
            </div>
        </div>
        <div id="boards">
            <div id="player1" class="current-turn">
                <div class="board">
                    <h3>Player One</h3>
                    <div class="tileAreas">
                        <game-board type="triangle"></game-board>
                        <game-board type="grid"></game-board>
                    </div>
                    <overflow-board />
                </div>
            </div>
            <div id="player2">
                <div class="board">
                    <h3>Player Two</h3>
                    <div class="tileAreas">
                        <game-board type="triangle"></game-board>
                        <game-board type="grid"></game-board>
                    </div>
                    <overflow-board />
                </div>
            </div>
        </div>
        <div id="gameButtons">
            <button id="moveTilesToGameboard" style="display: none;">Move Tiles to Gameboard</button>
            <button id="moveTilesToScoreboard" style="display: none;">Move Tiles to Scoreboard</button>
            <button id="startGame">Start Game</button>
            <button id="dealTilesButton" style="display: none;">Deal tiles</button>
        </div>
        <div id="tileCircles"></div>
        <div id="floorAxrea">
            <div id="floor"></div>
        </div>
    </body>
</html>
