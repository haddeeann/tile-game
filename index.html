<html>
    <head>
        <title>Yellow Umbrella</title>
        <script type="module" src="logic.js"></script>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header>
            Welcome to Yellow Umbrella Gaming
        </header>
        <div id="boards">
            <div id="player1" class="current-turn">
                <div class="tileAreas">
                    <game-board type="triangle"></game-board>
                    <game-board type="grid"></game-board>
                </div>
                <overflow-board />
            </div>
            <div id="player2">
                <div class="tileAreas">
                    <game-board type="triangle"></game-board>
                    <game-board type="grid"></game-board>
                </div>
                <overflow-board />
            </div>
        </div>
        <div id="gameButtons">
            <button id="moveTilesToGameboard" style="display: none;">Move Tiles to Gameboard</button>
            <button id="moveTilesToScoreboard">Move Tiles to Scoreboard</button>
            <button id="dealTilesButton">Deal tiles on circles</button>
        </div>
        <div id="tileCircles"></div>
    </body>
</html>
